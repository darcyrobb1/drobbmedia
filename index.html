@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap");

  --ink: #121212;
  --paper: #f4f4f1;
  --white: #ffffff;

.brand-logo {

.scroll-indicator span {

@keyframes scroll-dot {

.section {

}

.portfolio-panel-copy {

  z-index: 2;

.portfolio-panel-copy .eyebrow {

.portfolio-photo-grid {

  background: var(--black);
}

.portfolio-photo-pair {
  min-height: 100svh;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(10px, 1.6vw, 22px);
  margin: 0;
  padding: clamp(10px, 1.6vw, 22px);
}

.portfolio-photo-tile {
  min-height: 0;
  margin: 0;
  overflow: hidden;
  border-radius: 0;
  background: var(--black);
}

.portfolio-photo-tile img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.portfolio-scroll-trigger {

  left: 50%;
  bottom: 24px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: rgba(255, 255, 255, 0.74);
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  transform: translateX(-50%);
}

.portfolio-scroll-trigger a {

}

.portfolio-scroll-trigger span {

}

@keyframes portfolio-scroll-line {
  0% {
    transform: scaleY(0.25);
    transform-origin: top;
    opacity: 0.38;
  }
  55% {
    transform: scaleY(1);
    opacity: 1;
  }
  100% {
    transform: scaleY(0.25);
    transform-origin: bottom;
    opacity: 0.38;
  }
}

.gallery-item img {

  height: 100%;

}

.gallery-item:hover img {

}

.filter-row {

}

}

.filter-active {

}

.gallery-grid {

}

.gallery-item figcaption span {

}

.services-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.service-card {

  flex-direction: column;
  justify-content: space-between;
  gap: 24px;

.service-card p,

}

.service-footer {

.service-footer a {

  text-transform: uppercase;
}

.contact-grid {

.contact-links {

.contact-links span {

.contact-form label {

.footer {

.footer nav,
.footer-social {

  font-weight: 800;

}

.footer p {
  grid-column: 1 / -1;
  margin: 0;
  color: rgba(244, 244, 241, 0.52);
  font-size: 0.82rem;
}

@media (max-width: 1100px) {

}

@media (max-width: 900px) {

    display: none;

  .nav-toggle {
    display: block;
  }

  .nav-links {
    position: absolute;

  }

  .site-grid {

  .portrait-frame,

    min-height: 520px;
  }

  .portfolio-panel {
    min-height: 100svh;
    grid-template-columns: 1fr;
    padding: 0;
  }

  .portfolio-panel-copy {
    width: min(100% - 28px, 608px);

    padding-bottom: 51px;

@media (max-width: 640px) {

    align-items: flex-end;
    padding-bottom: 82px;

  .hero-content h1 {
    font-size: clamp(3.28rem, 17.6vw, 4.8rem);

  }

  .section-heading h2 {
    font-size: clamp(2.45rem, 15vw, 4.2rem);

  .image-card {
    min-height: 470px;
  }

  .gallery-grid {
    columns: 1;
  }

  .gallery-item,
  .gallery-item.span-1,
  .gallery-item.span-2,
  .gallery-item.span-3,
  .gallery-item.span-4,
  .gallery-item.span-5 {

  }

  .services-grid,
  .contact-form {
    grid-template-columns: 1fr;
  }

  .service-card:last-child {
    grid-column: auto;
  }

  .contact-form .full {
    grid-column: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

.mx-auto { margin-left: auto; margin-right: auto; }
.text-center { text-align: center; }

function PortfolioPanel({ section }) {
  const panelRef = useRef(null);
  const photos = useMemo(() => shuffled(section.photos), [section.photos]);
  const isSports = section.id === "portfolio-sports";
  const { scrollYProgress } = useScroll({
    target: panelRef,
    offset: ["start start", "55% start"],
  });
  const sportsOpacity = useTransform(scrollYProgress, [0, 0.42, 1], [1, 0.86, 0]);
  const sportsY = useTransform(scrollYProgress, [0, 1], [0, -150]);
  const sportsScale = useTransform(scrollYProgress, [0, 0.45, 1], [1, 1.08, 0.72]);
  const sportsBlur = useTransform(scrollYProgress, [0, 0.65, 1], ["blur(0px)", "blur(0px)", "blur(18px)"]);

  return e(
    "article",
    { ref: panelRef, key: section.id, id: section.id, className: `portfolio-panel ${isSports ? "portfolio-panel-featured" : ""}` },
    e(
      motion.div,
      {
        className: "portfolio-panel-copy",
        style: isSports ? { opacity: sportsOpacity, y: sportsY, scale: sportsScale, filter: sportsBlur } : undefined,
        initial: { opacity: 0, y: isSports ? 80 : 34 },
        whileInView: { opacity: 1, y: 0 },
        viewport: { once: false, amount: isSports ? 0.72 : 0.36 },
        transition: { duration: isSports ? 0.95 : 0.7, ease: [0.16, 1, 0.3, 1] },
      },
      e("p", { className: "eyebrow" }, `Portfolio / ${section.number}`),
      e("h2", null, section.title),
      e("p", null, section.text),
    ),
    e(
      "div",
      { className: "portfolio-photo-grid", "aria-label": `${section.title} portfolio photos` },
      paired(photos).map((photoPair, pairIndex) =>
        e(
          motion.div,
          {
            key: photoPair.join("|"),
            className: "portfolio-photo-pair",
            initial: { opacity: 0, y: 42, scale: 0.96 },
            whileInView: { opacity: 1, y: 0, scale: 1 },
            viewport: { once: true, margin: "-80px" },
            transition: { duration: 0.7, delay: Math.min(pairIndex, 5) * 0.05, ease: [0.16, 1, 0.3, 1] },
          },
          photoPair.map((photo, offset) =>
            e(
              "figure",
              { key: photo, className: "portfolio-photo-tile" },
              e("img", { src: photo, alt: `${section.title} portfolio photo ${pairIndex * 2 + offset + 1}`, loading: pairIndex < 2 ? "eager" : "lazy" }),
            ),
          ),
        ),
      ),
    ),
    section.nextId
      ? e(
          "div",
          { className: "portfolio-scroll-trigger", "data-next-section": section.nextId },
          e("a", { href: `#${section.nextId}` }, `Continue to ${section.nextId === "portfolio-events" ? "Events" : "Commercial"}`),
          e("span", { "aria-hidden": true }),
        )
      : null,
  );
}

function PortfolioCategories() {
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return undefined;

    const viewed = new Set();
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const nextId = entry.target.getAttribute("data-next-section");
          if (!nextId || viewed.has(nextId)) return;
          viewed.add(nextId);
          window.setTimeout(() => {
            document.getElementById(nextId)?.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 280);
        });
      },
      { threshold: 0.78 },
    );

    document.querySelectorAll("[data-next-section]").forEach((element) => observer.observe(element));
    return () => observer.disconnect();
  }, []);

  return e(
    "section",
    { id: "portfolio", className: "portfolio-showcase" },
    portfolioSections.map((section) => e(PortfolioPanel, { key: section.id, section })),
  );
}
